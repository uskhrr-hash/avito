# --- Ежедневный пайплайн (run_daily.bat) ---
# build_stock → process_manager_inbox → compare_prices → build_autoload
# Парсер Avito отключён: цены только из остатков (база × 1.15)

stores_file: stores.yaml

# Диски рядом с шинами. Disable: wheels.enabled: false
# include_in_publish: true — диски в live XML вместе с шинами.
# Опционально: publish_ids: [md_…] — пилот только этих Id; publish_limit: N.
wheels:
  enabled: true
  types: ["1", "2", "3"]
  product_type: Диски
  include_in_autoload: true
  include_in_publish: true
  skip_without_photos: true
  publish_ids: []
  # publish_limit: 5

stock_sources:
  enabled: true
  secrets_file: secrets.local.yaml
  google:
    enabled: true
    csv_url: https://docs.google.com/spreadsheets/d/e/2PACX-1vRueNtuxLTIbLTXKuGfYXUThpQvLJMzClkSodCgLAxjzcTSTShkl3QgDMzYx1LlbQTwHk0tB3LKdcEr/pubhtml
    spreadsheet_id: 17t6-RP1koXxsCK-PkYiv8Lb2wQ2DMwVh6okxvQkVzNE
    worksheet: Лист1
    columns:
      article: product_id
      name: name
      price: price
      quantity: quantity
  db:
    enabled: true
    min_quantity: 4
    moscow_min_quantity: 40
    supplier_ufa: Сам МБ Уфа
    # Москва: только П4 (с УШК и qty>moscow_min); в П6 не участвует
    supplier_moscow: Сам МБ Москва
    ushk_prefix: УШК
    ufa_multiplier: 0.9
    moscow_multiplier: 0.9
    excluded_suppliers:
      - Сам МБ прочие
      - Вектра Екб
      - Вектра Уфа
      - Колобокс Нижний
      - Колобокс Уфа
      - Шинсервис
      - Римэкс
    # УШК — по префиксу ushk_prefix; остальные — явный список
    allowed_suppliers:
      - Сам МБ Уфа
      - Сам МБ Москва
      - Бринэкс
      - Пауэр Уфа
      - Шининвест

descriptions_db:
  enabled: true
  schema_sql: sql/avito_descriptions.sql
  sqlite_schema_sql: sql/avito_descriptions_sqlite.sql
  pg_schema: public
  # Подключение: secrets.local.yaml → descriptions_db (отдельно от ERP db/alpha)
  auto_approve_llm: true
  llm_max_chars: 2500

stock_db:
  path: data/avito_stock.db
  schema_sql: sql/avito_stock_sqlite.sql

# Публикация фида на VPS (avito.shinaufa.ru) + API автозагрузки
avito_publish:
  enabled: false
  feed_name: shinaufa
  feed_public_url: https://avito.shinaufa.ru/feeds/autoload.xml
  feed_filename: autoload.xml
  # Почта для отчётов автозагрузки (обязательна для API profile)
  report_email: ""
  # Расписание (опционально; иначе ежедневно 04:00 МСК)
  # schedule:
  #   - rate: 1000
  #     weekdays: [0, 1, 2, 3, 4, 5, 6]
  #     time_slots: [4]
  # На VPS: каталог, откуда nginx отдаёт /feeds/
  feed_local_dir: /var/www/avito-feed/feeds
  auto_set_profile: true
  auto_upload: true

# Обновление уже размещённых объявлений (цена + остаток через API, без повторной публикации)
avito_sync:
  enabled: true
  dry_run: false
  stock_batch_size: 200
  price_pause_sec: 0.4
  refresh_ids_after_publish: true
  # Нет в posting (остатки кончились) → quantity=0 на Avito
  close_oos: true
  diff_only: true
  force_full_sync: false
  seed_on_empty: true
  price_max_retries: 4
  full_ids_refresh: true
  force_full_ids_refresh: false
  full_ids_min_interval_hours: 24
  full_ids_daily_hour: 3
  photo_updates_diff_only: false  # CRITICAL: true wiped catalog (Avito full-replace)
  force_full_photo_updates: true  # next builds emit full existing-ads XML

# Shared photo runtime for Photo v2 (disk/stock helpers; secrets → photo_upload.stores).
# UI process: run_photo_v2.py → :8766 (avito-photo-v2). Legacy v1 removed (S6).
photo_upload:
  enabled: true
  host: 127.0.0.1
  port: 8766
  session_max_age_hours: 72
  max_upload_mb: 12
  public_mount_path: /
  db_path: data/photo_upload.db
  contributors_prefix: contributors
  points_per_photo: 10
  contributor_max_photos: 10
  contributor_shops: []

compare:
  stock_only: true
  # stock_file deprecated — runtime uses stock_db (data/avito_stock.db)
  # stock_file: input/goods.xlsx
  stock_has_header: false
  stock_indexes:
    article: 0
    nomenclature: 1
    quantity: 2
    price: 3
  article_column: Артикул
  nomenclature_column: Номенклатура
  incoming_price_column: Цена
  quantity_column: Количество
  no_avito_multiplier: 1.15
  floor_multiplier: 1.1

autoload:
  # deprecated Excel paths (unused by daily; AvitoId from JSON API + sqlite)
  # template_file: input/432801655_2026-06-10T09_50_00Z.xlsx
  # working_file: input/autoload_working.xlsx
  prefer_latest_avito_export: false
  close_not_in_goods: true
  # Фото только с нашего сервера (photo upload → /opt/avito_tires_photos)
  photos_public_base_url: https://avito.shinaufa.ru/photos
  photo_layout: store_subdir
  # false — в папке md файлы 124889.jpg; магазин только по имени папки (stores.yaml → prefix)
  photo_store_prefix_in_filename: false
  image_count: 0
  image_ext: jpg
  convert_photos_to_jpeg: true
  jpeg_quality: 85
  compress_photos: true
  jpeg_max_dimension: 1920
  compress_min_kb: 400
  # Менеджеры загружают через https://avito.shinaufa.ru/
  photo_article_first: false
  manager_inbox_subdir: входящие
  # Если нет фото артикула — Yokohama Geolandar G015.jpg (бренд+модель)
  model_photo_fallback: true
  # Hotlink фото модели с shinaufa.ru (один HEAD на модель, кэш JSON)
  shinaufa_model_photos_enabled: true
  shinaufa_model_photos_base: https://shinaufa.ru/images/large/tyres
  shinaufa_model_photos_wheels_base: https://shinaufa.ru/images/large/wheels
  shinaufa_model_photo_cache: data/shinaufa_model_photo_cache.json
  shinaufa_model_photo_index: data/shinaufa_photo_index.sqlite
  shinaufa_model_photo_timeout_sec: 5
  shinaufa_model_photo_rate_limit_sec: 0.05
  # build_autoload: только индекс. Прогрев: warm_shinaufa_photos.py
  shinaufa_model_photo_live_fetch: false
  photos_local_dir: /opt/avito_tires_photos
  verify_photos_on_disk: true
  # Descriptions: descriptions_db only (Excel model_descriptions removed)

  skip_without_photos: true
  include_all_goods_in_autoload: false
  avito_ids_file: input/avito_ids.csv
  # Фид только для новых объявлений (без AvitoId) — в publish_avito_feed.py
  new_listings_feed: input/autoload_new.xml
  # Уже на Avito + наши фото — обновление без дублей (тот же Id + AvitoId)
  photo_updates_feed: input/autoload_photo_updates.xml
  # Остаток в описании («на складе»), не в колонке «Количество» (там всегда 1 = цена за 1 шт)
  max_listing_quantity: 12
  description_html: |
    <p><strong>{availability_headline}</strong></p>
    <p>Новые шины &quot;{nomenclature}&quot;🛞🛞🛞</p>
    <p><br></p>
    <p><strong>{payment_terms}</strong></p>
    <p>✅Предоставляем услугу шиномонтажа 👨‍🔧👨‍🔧👨‍🔧</p>
    <p><br></p>
    <p>В наличии и под заказ большой выбор шин и дисков Российских и Зарубежных производителей</p>
    <p><br></p>
    <p>‼️Представлен не весь ассортимент магазина‼️ Звоните или пишите в любое время, подберем отличный вариант для Вас!</p>
    <p>{model_description}</p>
    <p><br></p>
    {store_pitch}
    <p>Артикул: {article}. Цена за 1 шт: {price_human} руб.</p>
    <ul>
    <li>Количество на складе: {quantity}</li>
    <li>Самовывоз: Уфа и Стерлитамак.</li>
    <li>Адрес: {address}</li>
    <li>Контакт: {contact_person}, {phone}</li>
    <li>Связь: {contact_method}</li>
    </ul>
    <p>Перед выездом уточняйте актуальное наличие и стоимость.</p>
  store_pitch_html: |
    <p><strong>Почему покупают в Шинном Центре №1</strong></p>
    <ul>
    <li><strong>Шины в наличии</strong> — приезжайте, смотрите, сравнивайте на месте</li>
    <li><strong>Честная цена за наличные</strong> — без скрытых накруток и сюрпризов при оплате</li>
    <li><strong>Шиномонтаж на месте</strong> — поставили и поехали, не нужно искать сервис отдельно</li>
    <li><strong>Подберём под ваш авто</strong> — звоните или пишите, поможем с размером и моделью</li>
    <li><strong>Несколько точек в Уфе</strong> — удобный самовывоз, контакты в объявлении</li>
    </ul>
    <p>Работаем для частных клиентов и бизнеса. Приезжайте — убедитесь сами, что с нами удобно и выгодно!</p>
  llm_store_brief: ""
  defaults:
    listing_type: Package
    contact_person: Владислав
    phone: '79273181543'
    address: Республика Башкортостан, Уфа, улица Менделеева, 21
    contact_method: По телефону и в сообщениях
    category: Запчасти и аксессуары
    goods_type: Шины, диски и колёса
    ad_type: Товар приобретен на продажу
    product_type: Шины
    merge_ads: Да
    free_mounting: Нет
    condition: Новое
    run_flat: Нет
    audience: Частные лица и бизнес
    company: Шинный Центр №1
    email: md@shinaufa.ru

