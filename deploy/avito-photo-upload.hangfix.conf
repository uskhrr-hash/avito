[Unit]
# Не крутить ImportError-loop минутами (как 12.08).
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Environment=PHOTO_UPLOAD_WORKERS=2
# Smoke: не стартовать, если app/service разъехались после частичного деплоя.
ExecStartPre=/opt/avito_tires_parser/.venv/bin/python -c "import sys; sys.path.insert(0, '.'); from avito.photo_upload import service as s; from avito.photo_upload import app as a; assert hasattr(s, 'DEFAULT_SEARCH_LIMIT'); assert hasattr(a, 'create_app')"
