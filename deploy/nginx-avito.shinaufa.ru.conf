# nginx: avito.shinaufa.ru
# On server: /etc/nginx/sites-available/avito.shinaufa.ru.conf
#
# A1 (2026-08-20): short vs long request classes.
#   SHORT - photo UI/API (except upload): connect 5s, send/read 15s
#   LONG  - /api/upload + /chat/: timeouts 120s
#   STATIC - /photos/, /static/: disk, sendfile, access_log off
# HTTP/2: off on listen 443 (shared with booking). See deploy/ARCHITECTURE_AVITO.md
# S5 (2026-08-21): Photo v2 at / (8766). Old /photo/ and /photo/v2/ → 301 /.
#   v1 :8765 kept running but not exposed until S6 delete.
#   /chat/, /feeds/, /photos/, /health untouched.

server {
    listen 80;
    server_name avito.shinaufa.ru;

    # INCIDENT 2026-08-13: Secure session cookies require HTTPS.
    location = /photo {
        return 301 https://$host/;
    }
    location = /photo/v2 {
        return 301 https://$host/;
    }
    location /photo/ {
        return 301 https://$host/;
    }
    location /api/ {
        return 301 https://$host$request_uri;
    }
    location ^~ /static/ {
        return 301 https://$host$request_uri;
    }
    location = /healthz {
        return 301 https://$host/healthz;
    }

    access_log /var/log/nginx/avito.shinaufa.ru.access.log avito_timing;
    error_log  /var/log/nginx/avito.shinaufa.ru.error.log warn;

    location = /chat {
        return 301 /chat/;
    }
    location /chat/ {
        limit_conn conn_avito_chat 6;
        proxy_pass http://127.0.0.1:5055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location = /chat-site {
        return 301 https://shinaufa.ru/chat/;
    }
    location /chat-site/ {
        return 301 https://shinaufa.ru/chat/;
    }

    location /feeds/ {
        alias /var/www/avito-feed/feeds/;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # A1: http2 NOT present (shared listen 443 with booking/tyren1/sms-*).
    listen 443 ssl;
    server_name avito.shinaufa.ru;

    root /var/www/avito-feed;

    access_log /var/log/nginx/avito.shinaufa.ru.access.log avito_timing;
    error_log  /var/log/nginx/avito.shinaufa.ru.error.log warn;

    ssl_certificate /etc/letsencrypt/live/avito.shinaufa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avito.shinaufa.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/limit-conn-443.conf;

    location /feeds/ {
        alias /var/www/avito-feed/feeds/;
        add_header Cache-Control "no-cache";
    }

    # STATIC: public photos
    location ^~ /photos/ {
        limit_conn conn_avito_photos 4;
        alias /opt/avito_tires_photos/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        types {
            image/jpeg jpg jpeg;
            image/png png;
        }
        default_type image/jpeg;
    }

    # STATIC: Photo v2 (root)
    location ^~ /static/ {
        alias /opt/avito_tires_parser/avito/photo_v2/static/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Old path redirects (bookmarks) — before any leftover /photo proxies
    location = /photo {
        return 301 /;
    }
    location = /photo/v2 {
        return 301 /;
    }
    location /photo/ {
        return 301 /;
    }

    # AUTH v2 short
    location = /api/logout {
        limit_conn conn_avito_photo 4;
        proxy_pass http://127.0.0.1:8766/api/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        client_max_body_size 16k;
    }
    location = /api/login {
        limit_conn conn_avito_photo 4;
        proxy_pass http://127.0.0.1:8766/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        client_max_body_size 32k;
    }

    # LONG: Photo v2 upload
    location = /api/upload {
        limit_conn conn_avito_upload 2;
        proxy_pass http://127.0.0.1:8766/api/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # SHORT: Photo v2 API
    location /api/ {
        limit_conn conn_avito_photo 6;
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 1M;
    }

    # SHORT: healthz
    location = /healthz {
        limit_conn conn_avito_photo 6;
        proxy_pass http://127.0.0.1:8766/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 1M;
    }

    location = /chat {
        return 301 /chat/;
    }

    # LONG: Chat
    location /chat/ {
        limit_conn conn_avito_chat 6;
        proxy_pass http://127.0.0.1:5055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location = /chat-site {
        return 301 https://shinaufa.ru/chat/;
    }
    location /chat-site/ {
        return 301 https://shinaufa.ru/chat/;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SHORT: Photo v2 UI at domain root
    location = / {
        limit_conn conn_avito_photo 6;
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 1M;
    }

    location / {
        return 404;
    }
}
